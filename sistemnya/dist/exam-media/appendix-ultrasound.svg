<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Graded-compression ultrasound of the right iliac fossa showing a non-compressible blind-ending tubular structure">
  <defs>
    <radialGradient id="usfan" cx="50%" cy="8%" r="105%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="45%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>
    <radialGradient id="target" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b3b3b"/>
      <stop offset="55%" stop-color="#1a1a1a"/>
      <stop offset="72%" stop-color="#d8d8d8"/>
      <stop offset="82%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
  </defs>
  <rect width="640" height="480" fill="#000"/>
  <!-- sector fan -->
  <path d="M320 12 L120 468 L520 468 Z" fill="url(#usfan)"/>
  <!-- speckle texture -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="250" cy="150" r="2"/><circle cx="330" cy="120" r="1.5"/><circle cx="400" cy="180" r="2"/>
    <circle cx="220" cy="260" r="1.5"/><circle cx="300" cy="300" r="2"/><circle cx="430" cy="280" r="1.5"/>
    <circle cx="360" cy="360" r="2"/><circle cx="270" cy="380" r="1.5"/><circle cx="410" cy="400" r="2"/>
    <circle cx="200" cy="330" r="1.5"/><circle cx="480" cy="340" r="2"/><circle cx="340" cy="220" r="1.5"/>
  </g>
  <!-- target sign: appendix in cross-section (non-compressible, >6mm) -->
  <circle cx="330" cy="270" r="52" fill="url(#target)"/>
  <circle cx="330" cy="270" r="52" fill="none" stroke="#e8e8e8" stroke-width="1.5" opacity="0.5"/>
  <!-- calipers marking diameter -->
  <g stroke="#39e639" stroke-width="1.6" fill="#39e639">
    <line x1="278" y1="270" x2="382" y2="270"/>
    <path d="M278 264 l0 12 M382 264 l0 12"/>
    <rect x="392" y="256" width="9" height="9" transform="rotate(45 396 260)"/>
    <rect x="259" y="266" width="9" height="9" transform="rotate(45 263 270)"/>
  </g>
  <!-- depth scale ticks -->
  <g stroke="#8fa0b0" stroke-width="1" opacity="0.7">
    <line x1="516" y1="90" x2="524" y2="90"/><line x1="516" y1="180" x2="524" y2="180"/>
    <line x1="516" y1="270" x2="524" y2="270"/><line x1="516" y1="360" x2="524" y2="360"/>
  </g>
  <g font-family="Consolas, Menlo, monospace" fill="#c7d0dc">
    <text x="16" y="30" font-size="14">US  RIF  C5-1  MI 0.8</text>
    <text x="410" y="264" font-size="13" fill="#39e639" font-weight="700">Ø 8.4 mm</text>
    <text x="16" y="462" font-size="12" fill="#8fa0b0">Non-compressible blind-ending tubular structure · target sign</text>
  </g>
</svg>
