<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Abdominal examination showing right iliac fossa tenderness at McBurney's point">
  <defs>
    <radialGradient id="abskin" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#f0cdb3"/>
      <stop offset="100%" stop-color="#dca886"/>
    </radialGradient>
  </defs>
  <rect width="640" height="480" fill="#101826"/>
  <!-- torso -->
  <path d="M180 40 Q320 20 460 40 Q500 180 470 320 Q430 440 320 452 Q210 440 170 320 Q140 180 180 40 Z" fill="url(#abskin)"/>
  <!-- rib margin -->
  <path d="M220 120 Q320 165 420 120" fill="none" stroke="#c08a68" stroke-width="4" opacity="0.6"/>
  <!-- linea alba -->
  <path d="M320 130 L320 360" stroke="#c99a7c" stroke-width="3" opacity="0.5"/>
  <!-- umbilicus -->
  <circle cx="320" cy="250" r="10" fill="#b07c5c" opacity="0.8"/>
  <circle cx="320" cy="250" r="10" fill="none" stroke="#8a5c40" stroke-width="2"/>
  <!-- iliac crests -->
  <path d="M185 300 Q230 330 250 372 M455 300 Q410 330 390 372" fill="none" stroke="#c08a68" stroke-width="3" opacity="0.5"/>
  <!-- McBurney's point: patient's right iliac fossa (image left) -->
  <g>
    <circle cx="245" cy="322" r="46" fill="#e23b32" opacity="0.20"/>
    <circle cx="245" cy="322" r="30" fill="#e23b32" opacity="0.28"/>
    <line x1="245" y1="300" x2="245" y2="344" stroke="#c62828" stroke-width="3"/>
    <line x1="223" y1="322" x2="267" y2="322" stroke="#c62828" stroke-width="3"/>
  </g>
  <!-- ASIS-umbilicus reference line -->
  <line x1="320" y1="250" x2="250" y2="365" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.55"/>
  <!-- label -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="300" y="300" width="196" height="46" rx="8" fill="#0d1420" opacity="0.85"/>
    <text x="314" y="322" fill="#ff8a80" font-size="15" font-weight="700">McBurney's point</text>
    <text x="314" y="339" fill="#c7d0dc" font-size="12">Guarding · Rovsing's +ve</text>
  </g>
  <text x="24" y="452" fill="#8b97a8" font-size="13" font-family="Segoe UI, Arial, sans-serif">Supine · point tenderness RIF · rebound present</text>
</svg>
